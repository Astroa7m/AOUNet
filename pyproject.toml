[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "AOUNet"
version = "0.0.1"

[tool.setuptools.packages.find]
where = ["."]
include = ["auth*", "uni*", "common*", "data*", "data_prep*", "graph*", "probs*", "ui*"]

[tool.setuptools.package-data]
auth = ["demo_users.json"]
